# Atualização mensal do SINAPI.
# A Caixa publica o mês de referência por volta do dia 10 do mês seguinte. A tarefa tenta
# três vezes por dia, do dia 8 ao 28: quando o mês já está carregado, termina sem fazer nada.
# Se a Caixa recusar o download, o robô espera e tenta de novo na mesma execução.
# Precisa do segredo SINAPI_DATABASE_URL (conexão de administrador do banco), cadastrado em
# Settings > Secrets and variables > Actions.
name: Atualizar SINAPI

on:
  schedule:
    - cron: "30 9,15,21 8-28 * *" # 6h30, 12h30 e 18h30 de Brasília
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês de referência (AAAA-MM). Vazio: os meses que faltam."
        required: false
      url:
        description: "Endereço do arquivo .zip, ou caminho de um arquivo do repositório."
        required: false
      uf:
        description: "UF"
        required: false
        default: "RJ"

permissions:
  contents: read

concurrency:
  group: sinapi
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baixar e carregar
        env:
          DATABASE_URL: ${{ secrets.SINAPI_DATABASE_URL }}
          SINAPI_MES: ${{ inputs.mes }}
          SINAPI_URL: ${{ inputs.url }}
          SINAPI_UF: ${{ inputs.uf || 'RJ' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Cadastre o segredo SINAPI_DATABASE_URL."; exit 1; fi
          npm run atualizar-sinapi
